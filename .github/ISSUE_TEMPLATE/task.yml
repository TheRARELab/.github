name: Task
description: Create a task that follows lab workflow.
body:
- type: textarea
  attributes:
    label: Task Description
    description: What info is needed to ensure a good understanding of the task/problem?
    value: "- [ ] subtask"
  validations:
    required: true
- type: textarea
  attributes:
    label: Learning Resources
    description: Resources or team memberhelp needed to finish the task.
- type: input
  attributes:
    label: Deliverable & Deliverable test
- type: input
  attributes:
    label: Reviewer
    description: Who will review the deliverable or PR? The default is prof, but it should be offloaded to team members familiar with the task.
    value: "Prof"
- type: markdown
  attributes:
    value: |
      ### Assignee Checklist (after creating and before working on task)
      - [ ] I agree to help project management to monitor project progress and make it happen.
        - I just reviewed our project board and kept my tasks updated, following [workflow](https://github.com/TheRARELab/handbook/blob/main/Workflow/): (a) setting a start date (as work starts), (b) changing task status (as task flows), (c) setting an end date (only after review completes).
      - [ ] I agree to be a good communicator, including
        1. After each work session (UG) or every day (grad), I will keep team/prof informed: I will reply with progress update (w/ photos/videos), my plan next with date for my next work session, and inform my other commitments early.
        2. Every day, I read my teammate/prof's GitHub updates, emails, and Team messages and reply (UG: several minutes) to keep my tasks moving forward.
        3. During meetings, I take notes on notebook/laptop, which I will transfer them to GitHub issues after meeting.
        4. I just checked. My weekly lab presence is up to date on lab calendar so others can expect when I can make progress.
      - [ ] I fully understand & agree to review biweekly and follow lab [expectations/values](https://github.com/TheRARELab/handbook/blob/main/Expectations.md) and [handbook](https://github.com/TheRARELab/handbook/). 
