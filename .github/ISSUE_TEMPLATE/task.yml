name: Task
description: Create a task that follows lab workflow.
body:
- type: textarea
  attributes:
    label: Task (what needs to be done?)
    description:  What info is needed to ensure a good understanding of the task/problem?
    value: "- [ ] subtask"
  validations:
    required: true
- type: textarea
  attributes:
    label: Learning Resources
    description: Resources or team memberhelp needed to finish the task.
- type: input
  attributes:
    label: Deliverable & Deliverable test
- type: input
  attributes:
    label: Reviewer
    description: Who will review this task or PR? The default is prof, but it should be offloaded to team members familiar with the task.
    value: "Prof"
- type: checkboxes
  attributes:
    label: \[For assignee; required\] Lab Expectations and Workflow
    description: By working on this task, assignee agrees to follow lab [expectations](https://github.com/TheRARELab/handbook/blob/main/Expectations.md), [workflow](https://github.com/TheRARELab/handbook/blob/main/Workflow/), and [lab handbook](https://github.com/TheRARELab/handbook/). 
    options:
      - label: I agree to follow lab expectations, workflow, and lab handbook.
