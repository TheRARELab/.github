name: Task
description: Create a task that follows lab workflow/expectations/handbook.
body:
- type: textarea
  attributes:
    label: Task Description/List & Learning Resources/Helping Teammates
    description: What info is needed to ensure a good understanding of the task/problem? Resources or team member help needed to finish the task.
- type: input
  attributes:
    label: Deliverable, Test, Reviewer
- type: checkboxes
  attributes:
    label: "A few reminders"
    options:
      - label: "If possible, I will try my best to:\n1. provide update & plan (can also include busy times like exams or projects) before each work session ends, including [AI Use](https://github.com/TheRARELab/handbook/blob/main/Quality%20Standards/AI%20Use%20Standards.md) & keep lab calendar reasonably up to date.\n2. follow the [lab workflow](https://github.com/TheRARELab/handbook/blob/main/Workflow/) (e.g., status, monitor tasks on project board) & [expectations](https://github.com/TheRARELab/handbook/blob/main/Expectations.md) in [handbook](https://github.com/TheRARELab/handbook/).\n3. reply to my teammate promptly when you have time within my work hours."
