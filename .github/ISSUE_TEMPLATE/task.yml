name: Task
description: Create a task that follows lab workflow.
body:
- type: textarea
  attributes:
    label: Task Description
    description: What info is needed to ensure a good understanding of the task/problem?
    value: "- [ ] subtask"
  validations:
    required: true
- type: textarea
  attributes:
    label: Learning Resources
    description: Resources or team memberhelp needed to finish the task.
- type: input
  attributes:
    label: Deliverable & Deliverable test
- type: input
  attributes:
    label: Reviewer
    description: Who will review the deliverable or PR? The default is prof, but it should be offloaded to team members familiar with the task.
    value: "Prof"
- type: markdown
  attributes:
    value: |
      ### Assignee Checklist (before working on tasks)
      - [ ] I agree to help project management by, e.g., (1) actively reviewing our project board, (2) setting a start date (as work starts), (3) changing task status (as task flows), (4)setting an end date (as review finishes), and more.
      - [ ] I agree to be a good communicator, e.g., keep team/prof informed. After one (ideally) or two work sessions (UG) or 2 to 1 days (grad), I will reply with progress update (w/ photos/videos) & plan next with date.
      - [ ] I fully understand & agree to review (if not) and follow lab [expectations/values](https://github.com/TheRARELab/handbook/blob/main/Expectations.md), [workflow](https://github.com/TheRARELab/handbook/blob/main/Workflow/), and [handbook](https://github.com/TheRARELab/handbook/). 
